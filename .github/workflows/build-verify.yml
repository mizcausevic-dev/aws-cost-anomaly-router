name: Build verification

# BUILD ONLY. This workflow does not deploy.
#
# Deployment to awsfinops.kineticgain.com is manual, over SSH/SFTP on port 65002
# to the Hostinger web estate. The FTP deploy step that used to live here was
# removed 2026-08-20 for three reasons, in order of weight:
#
#   1. It raced the SSH path. Both wrote to the same docroot and the last writer
#      won, with nothing surfacing the conflict. This one was workflow_dispatch
#      only, so it was a dormant trap rather than an active race: harmless until
#      someone clicked Run, at which point it would have quietly reverted the
#      docroot to whatever this branch happened to build.
#   2. FTP from shared GitHub runner IPs is unreliable against this host
#      (control-socket timeouts traced to IP reputation; the documented fix is
#      SSH-key SFTP on 65002, which is what the manual path already uses).
#   3. It required live production FTP credentials in repo secrets.
#
# This repo has no build step - index.html ships as authored - so this job is a
# content gate rather than a compile gate: it asserts the shipped page still
# carries its title, SEO assets, and the canonical estate palette.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-aws-cost-anomaly-router
  cancel-in-progress: true

jobs:
  verify:
    name: Verify shipped assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify shipped files
        run: |
          test -f index.html   || (echo "FAIL: index.html missing" && exit 1)
          test -f favicon.svg  || (echo "FAIL: favicon.svg missing" && exit 1)
          test -f CNAME        || (echo "FAIL: CNAME missing" && exit 1)
          test -f robots.txt   || (echo "FAIL: robots.txt missing" && exit 1)
          test -f sitemap.xml  || (echo "FAIL: sitemap.xml missing" && exit 1)
          grep -q "AWS Cost Anomaly Router" index.html || \
            (echo "FAIL: index.html missing title" && exit 1)
          grep -q "application/ld+json" index.html || \
            (echo "FAIL: JSON-LD block missing" && exit 1)
          grep -qi "#0B0C10" index.html || \
            (echo "FAIL: canonical BERT ground #0B0C10 not present" && exit 1)
          echo "OK: shipped assets verified"

      - name: Validate JSON-LD parses
        run: |
          python3 - <<'PY'
          import json, re, sys
          html = open("index.html", encoding="utf-8").read()
          blocks = re.findall(
              r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>',
              html, re.S)
          if not blocks:
              sys.exit("FAIL: no JSON-LD block found")
          for b in blocks:
              json.loads(b)
          print(f"OK: {len(blocks)} JSON-LD block(s) parse as valid JSON")
          PY

      # No deploy step, and deliberately no live-site check either. A curl
      # against the production URL from here would report on whatever the last
      # SSH deploy put there, not on the commit this run just built - a green
      # check that proves nothing about this build. Verifying the artifact
      # above is the honest boundary of what a build job can assert.
